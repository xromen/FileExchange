name: Сборка и публикация

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: file-exchange-releases
  cancel-in-progress: false
  queue: max

jobs:
  release:
    if: github.ref == 'refs/heads/master'
    runs-on: windows-2025-vs2026
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Собрать программу и ZIP
        shell: powershell
        run: .\FileExchange\Build.ps1

      - name: Проверить копирование, COM, WPF и диагностику установки
        shell: powershell
        run: |
          & .\FileExchange\artifacts\app\FileExchange.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Не прошла проверка программы.' }
          dotnet run --project .\FileExchange\ShellExtension\AbiCheck\AbiCheck.csproj -c Release -- .\FileExchange\artifacts\app\FileExchange.ShellExtension.dll
          if ($LASTEXITCODE -ne 0) { throw 'Не прошла проверка COM.' }
          dotnet .\FileExchange\Manager\bin\Release\net10.0-windows\win-x64\FileExchange.Manager.dll --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Не прошла проверка WPF-приложения.' }
          & .\FileExchange\Packaging\Test-InstallErrors.ps1
          & .\FileExchange\Packaging\Test-Update.ps1

      - name: Опубликовать GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = Get-Content -Raw .\FileExchange\artifacts\release.json | ConvertFrom-Json
          $tag = "v$($release.Version)"
          $archive = Join-Path .\FileExchange\artifacts $release.ArchiveName
          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          $head = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/heads/master" --jq '.object.sha'
          if ($LASTEXITCODE -ne 0) { throw 'Не удалось получить текущий коммит master.' }
          $latest = ($head -eq $env:GITHUB_SHA).ToString().ToLowerInvariant()
          $draft = gh release view $tag --json isDraft --jq '.isDraft' 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($draft -eq 'false') { Write-Host "Релиз $tag уже опубликован."; exit 0 }
            gh release upload $tag $archive --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Не удалось загрузить архив в черновик релиза.' }
            gh release edit $tag --draft=false "--latest=$latest"
          } else {
            gh release create $tag $archive --target $env:GITHUB_SHA --title "Файловый обмен $($release.Version) ($shortSha)" --notes "Автоматическая сборка Windows x64 из master, коммит $env:GITHUB_SHA. Распакуйте ZIP целиком; инструкции находятся в README.md внутри архива." "--latest=$latest"
          }
          if ($LASTEXITCODE -ne 0) { throw 'Не удалось опубликовать GitHub Release.' }
